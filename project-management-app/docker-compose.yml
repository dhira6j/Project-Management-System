version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: project_management_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: project_management_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env # Path relative to docker-compose.yml (which is in project-management-app)
    environment:
      SECRET_KEY: your-super-secret-key-for-jwt-in-compose-make-sure-this-is-strong

  frontend:
    build:
      context: . # Context is project-management-app
      dockerfile: Dockerfile.frontend # Dockerfile.frontend is in project-management-app
    container_name: project_management_frontend
    ports:
      - "5173:80" # Vite dev server runs on 5173 by default, Nginx serves on 80 in container
    depends_on:
      - backend
    # For development, you might want to mount volumes for live reloading
    # volumes:
    #   - ./frontend:/app # Mounts the frontend directory
    #   - /app/node_modules # Excludes node_modules from being overwritten by the host mount
    # environment:
    #   - VITE_API_BASE_URL=http://localhost:8000 # Or http://backend:8000 if using Docker network

volumes:
  postgres_data:
